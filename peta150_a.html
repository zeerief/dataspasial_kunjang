<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Interaktif Data Spasial - Kunjang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 text-white shadow-md p-4 flex justify-between items-center z-10">
        <h1 class="text-xl font-bold">GIS Interaktif Desa & SubSLS</h1>
        <span class="text-sm bg-slate-700 px-3 py-1 rounded-full">Lokal Web App</span>
    </header>

    <!-- Main Container -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar Kontrol -->
        <aside class="w-96 bg-white shadow-lg z-20 flex flex-col p-4 overflow-y-auto">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Filter Wilayah</h2>

            <!-- Select ID Desa -->
            <div class="mb-4">
                <label for="select-iddesa" class="block text-sm font-medium text-gray-600 mb-1">Pilih ID Desa:</label>
                <select id="select-iddesa" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">-- Pilih ID Desa --</option>
                </select>
            </div>

            <!-- Select ID SubSLS -->
            <div class="mb-4">
                <label for="select-idsubsls" class="block text-sm font-medium text-gray-600 mb-1">Pilih ID SubSLS:</label>
                <select id="select-idsubsls" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 text-gray-800 focus:ring-2 focus:ring-blue-500 focus:outline-none" disabled>
                    <option value="">-- Pilih ID SubSLS Terlebih Dahulu --</option>
                </select>
            </div>

            <!-- Informasi Statistik / Detail -->
            <div class="mt-auto bg-blue-50 border border-blue-200 rounded-lg p-4">
                <h3 class="text-sm font-bold text-blue-800 mb-2">Informasi Terpilih</h3>
                <div id="info-content" class="text-xs text-blue-900 space-y-1">
                    <p>Silakan pilih ID Desa dan SubSLS untuk melihat detail poligon dan titik koordinat.</p>
                </div>
            </div>
        </aside>

        <!-- Area Peta Leaflet -->
        <main class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>
        </main>
    </div>

    <!-- Script Aplikasi -->
    <script>
        // Inisialisasi Peta (pusat di Kunjang, Kediri)
        const map = L.map('map').setView([-7.655, 112.145], 14);

        // Tambah Basemap OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let geojsonLayer = null;
        let pointsLayer = L.layerGroup().addTo(map);
        let geojsonRawData = null;
        let csvRawData = [];

        // Elemen DOM
        const selectIdDesa = document.getElementById('select-iddesa');
        const selectIdSubsls = document.getElementById('select-idsubsls');
        const infoContent = document.getElementById('info-content');

        // Load GeoJSON dan CSV secara lokal
        async function loadData() {
            try {
                // Fetch GeoJSON (Sesuaikan nama file jika berbeda)
                const geoResponse = await fetch('150.geojson');
                geojsonRawData = await geoResponse.json();

                // Render Poligon awal
                geojsonLayer = L.geoJSON(geojsonRawData, {
                    style: {
                        color: '#3b82f6',
                        weight: 2,
                        fillOpacity: 0.2
                    },
                    onEachFeature: (feature, layer) => {
                        const props = feature.properties;
                        layer.bindPopup(`<strong>SLS:</strong> ${props.nmsls \vert{}\vert{} '-'}<br><strong>ID SubSLS:</strong>${props.idsubsls}`);
                    }
                }).addTo(map);

                // Zoom ke batas poligon GeoJSON
                map.fitBounds(geojsonLayer.getBounds());

                // Populate Dropdown ID Desa dari GeoJSON
                const uniqueDesa = [...new Set(geojsonRawData.features.map(f => f.properties.iddesa))];
                uniqueDesa.forEach(iddesa => {
                    if (iddesa) {
                        const opt = document.createElement('option');
                        opt.value = iddesa;
                        opt.textContent = iddesa;
                        selectIdDesa.appendChild(opt);
                    }
                });

                // Fetch CSV menggunakan PapaParse (Sesuaikan nama file jika berbeda)
                Papa.parse('150.csv', {
                    download: true,
                    header: true,
                    complete: function(results) {
                        csvRawData = results.data;
                        console.log("CSV Loaded:", csvRawData.length, "baris");
                    }
                });

            } catch (error) {
                console.error("Gagal memuat data lokal:", error);
                alert("Pastikan file 150.geojson dan 150.csv berada di folder yang sama dan diakses melalui Local Server (misal: Live Server VS Code).");
            }
        }

        // Event Listener: Pilih ID Desa
        selectIdDesa.addEventListener('change', (e) => {
            const selectedDesa = e.target.value;
            selectIdSubsls.innerHTML = '<option value="">-- Pilih ID SubSLS --</option>';
            pointsLayer.clearLayers();

            if (!selectedDesa) {
                selectIdSubsls.disabled = true;
                map.fitBounds(geojsonLayer.getBounds());
                infoContent.innerHTML = `<p>Silakan pilih ID Desa dan SubSLS.</p>`;
                return;
            }

            // Filter SubSLS berdasarkan Desa yang dipilih
            const filteredFeatures = geojsonRawData.features.filter(f => f.properties.iddesa === selectedDesa);
            const uniqueSubsls = [...new Set(filteredFeatures.map(f => f.properties.idsubsls))];

            uniqueSubsls.forEach(idsubsls => {
                if (idsubsls) {
                    const opt = document.createElement('option');
                    opt.value = idsubsls;
                    opt.textContent = idsubsls;
                    selectIdSubsls.appendChild(opt);
                }
            });

            selectIdSubsls.disabled = false;

            // Zoom peta ke area desa terpilih
            const tempLayer = L.geoJSON({ type: "FeatureCollection", features: filteredFeatures });
            map.fitBounds(tempLayer.getBounds());
        });

        // Event Listener: Pilih ID SubSLS
        selectIdSubsls.addEventListener('change', (e) => {
            const selectedSubsls = e.target.value;
            pointsLayer.clearLayers();

            if (!selectedSubsls) return;

            // 1. Highlight / Filter Poligon GeoJSON berdasarkan idsubsls
            const targetFeature = geojsonRawData.features.find(f => f.properties.idsubsls === selectedSubsls);
            if (targetFeature) {
                const subslsLayer = L.geoJSON(targetFeature, {
                    style: { color: '#ef4444', weight: 3, fillOpacity: 0.4 }
                });
                map.fitBounds(subslsLayer.getBounds());

                infoContent.innerHTML = `
                    <p><strong>Desa:</strong> ${targetFeature.properties.nmdesa}</p>
                    <p><strong>SLS:</strong> ${targetFeature.properties.nmsls}</p>
                    <p><strong>ID SubSLS:</strong> ${selectedSubsls}</p>
                `;
            }

            // 2. Cari titik koordinat dari CSV berdasarkan idsubsls
            // Catatan: Sesuaikan nama kolom latitude/longitude di bawah dengan struktur header CSV Anda jika berbeda (misal: lat, lng / y, x)
            const matchedPoints = csvRawData.filter(row => row.idsubsls === selectedSubsls);
            
            let pointCount = 0;
            matchedPoints.forEach(row => {
                const lat = parseFloat(row.lat || row.latitude || row.y);
                const lng = parseFloat(row.lng || row.longitude || row.x);

                if (!isNaN(lat) && !isNaN(lng)) {
                    L.circleMarker([lat, lng], {
                        radius: 6,
                        fillColor: "#10b981",
                        color: "#fff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).bindPopup(`<strong>Titik Koordinat</strong><br>ID SubSLS: ${selectedSubsls}<br>Lat: ${lat}, Lng:${lng}`)
                      .addTo(pointsLayer);
                    pointCount++;
                }
            });

            if (pointCount > 0) {
                infoContent.innerHTML += `<p class="text-green-600 font-semibold mt-1">Ditemukan ${pointCount} titik koordinat.</p>`;
            } else {
                infoContent.innerHTML += `<p class="text-amber-600 mt-1">Tidak ada data titik koordinat spesifik untuk ID SubSLS ini di CSV.</p>`;
            }
        });

        // Jalankan pemuatan data saat halaman siap
        loadData();
    </script>
</body>
</html>
